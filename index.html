<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guia Saúde Rural Sem Boatos — OlacDev</title>
  <style>
    :root { --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #475569; --primary: #0f766e; --border: #cbd5e1; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    main { max-width: 780px; margin: 0 auto; padding: 24px 16px 48px; }
    input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; margin-bottom: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    footer { text-align: center; padding: 24px 16px; color: var(--muted); font-size: 0.9rem; border-top: 1px solid var(--border); }
    footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Guia Saúde Rural Sem Boatos</h1>
    <p>Respostas diretas baseadas em protocolos oficiais do SUS, funcionando 100% offline.</p>
    <input id="q" type="search" placeholder="Buscar por vacina, dengue, água..." aria-label="Buscar tema de saúde" />
    <section id="out" aria-live="polite"></section>
  </main>
  <footer>Made by <a href="https://olacdev.com/" target="_blank" rel="noopener noreferrer">OlacDev</a></footer>
  <script type="module">
    import { searchTopics } from './app.js';
    const q = document.getElementById('q');
    const out = document.getElementById('out');
    function render() {
      const list = searchTopics(q.value);
      out.innerHTML = list.map((t) => `<article class="card"><h3>${t.title}</h3><p><strong>${t.verdict}</strong> — ${t.explanation}</p><small>Fonte: ${t.source}</small></article>`).join('');
    }
    q.addEventListener('input', render);
    render();
  </script>
</body>
</html>
